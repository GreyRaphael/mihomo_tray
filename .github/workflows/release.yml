name: Release

on:
  push:
    tags:
      - 'v*' # 推送以 v 开头的 tag 时触发，例如 v0.2.0

permissions:
  contents: write # 创建 Release 与上传产物需要写权限

jobs:
  release:
    name: Build & Publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package portable bundle & prepare release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-LatestTag([string]$repo) {
            $resp = curl.exe -fsSI "https://github.com/$repo/releases/latest"
            if ($LASTEXITCODE -ne 0) { throw "Failed to query latest release for $repo" }
            foreach ($line in $resp) {
              if ($line -match '^(?i)location:\s*(.+)$') {
                $loc = $Matches[1].Trim().TrimEnd('/')
                $tag = ($loc -split '/')[-1]
                if (-not $tag) { throw "Failed to parse tag from $loc" }
                return $tag
              }
            }
            throw "Missing location header for $repo"
          }

          New-Item -ItemType Directory -Force -Path dist, dist\core, dist\config, dist\config\rules, dist\ui, tmp_ui | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\mihomo-tray.exe dist\mihomo-tray.exe
          Copy-Item assets\tray.sample.yml dist\tray.yml
          Copy-Item assets\config.sample.yaml dist\config\config.yaml
          Copy-Item README.md dist\README.md
          Copy-Item README_zh.md dist\README_zh.md
          Copy-Item LICENSE dist\LICENSE

          # 1. Latest Zephyruso/zashboard (dist-no-fonts.zip) -> dist\ui\
          $zashTag = Get-LatestTag "Zephyruso/zashboard"
          curl.exe -fsSL -o zashboard.zip "https://github.com/Zephyruso/zashboard/releases/download/$zashTag/dist-no-fonts.zip"
          if ($LASTEXITCODE -ne 0) { throw "Failed to download zashboard $zashTag" }
          Expand-Archive -Path zashboard.zip -DestinationPath tmp_ui -Force
          if (Test-Path tmp_ui\dist\index.html) {
            Copy-Item tmp_ui\dist\* dist\ui -Recurse -Force
          } elseif (Test-Path tmp_ui\index.html) {
            Copy-Item tmp_ui\* dist\ui -Recurse -Force
          } else {
            throw "index.html not found inside zashboard dist-no-fonts.zip"
          }

          # 2. Latest MetaCubeX/mihomo (mihomo-windows-amd64-v3-<tag>.zip) -> dist\core\
          $mihomoTag = Get-LatestTag "MetaCubeX/mihomo"
          curl.exe -fsSL -o mihomo.zip "https://github.com/MetaCubeX/mihomo/releases/download/$mihomoTag/mihomo-windows-amd64-v3-$mihomoTag.zip"
          if ($LASTEXITCODE -ne 0) { throw "Failed to download mihomo $mihomoTag" }
          Expand-Archive -Path mihomo.zip -DestinationPath dist\core -Force
          $kernelExe = Get-ChildItem -Path dist\core -Filter "mihomo*.exe" | Select-Object -First 1
          if (-not $kernelExe) { throw "mihomo executable missing after extraction" }

          # 3. Latest Country.mmdb & MetaCubeX binary .mrs rule-sets -> dist\config\
          curl.exe -fsSL -o dist\config\Country.mmdb "https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb"
          if ($LASTEXITCODE -ne 0) { throw "Failed to download Country.mmdb" }
          foreach ($rule in @("private", "category-ads", "cn", "category-ai-!cn", "google", "binance")) {
            curl.exe -fsSL -o "dist\config\rules\$rule.mrs" "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/$rule.mrs"
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $rule.mrs" }
          }

          # 4. Validate packaged config.yaml & geodata using the bundled mihomo kernel
          & $kernelExe.FullName -t -d dist\config -f dist\config\config.yaml
          if ($LASTEXITCODE -ne 0) { throw "mihomo config validation failed" }

          Compress-Archive -Path dist\* -DestinationPath mihomo-tray-windows-amd64.zip -Force

          $body = Get-Content -Raw -Encoding utf8 .github/release-body.md
          $body = $body.Replace('{{TAG}}', $env:GITHUB_REF_NAME)
          $body = $body.Replace('{{MIHOMO_TAG}}', $mihomoTag)
          $body = $body.Replace('{{ZASHBOARD_TAG}}', $zashTag)
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: mihomo-tray ${{ github.ref_name }}
          body_path: release-notes.md
          files: mihomo-tray-windows-amd64.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
