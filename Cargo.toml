[package]
name = "mihomo-tray"
version = "0.3.5"
edition = "2024"
rust-version = "1.100"
description = "Portable Windows 10+ system tray controller for mihomo with swappable core and WebUI"
license = "BSD-3-Clause"

[dependencies]
auto-launch = "0.6"
open = "5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
single-instance = "0.3"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tray-icon = { version = "0.26", default-features = false }
ureq = { version = "3.5", default-features = false, features = ["json"] }
winit = "0.30"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["muda-common-controls-v6"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
