# Default portable configuration for mihomo (generated for mihomo-tray).
# Use "Set Subscription URL" in the tray menu to configure your subscription;
# it updates every 12 hours automatically once set.

mixed-port: 7890
allow-lan: true
ipv6: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  mmdb: https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "rule-set:private,cn":
      - 223.5.5.5
      - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

proxies:
  - name: Local_HTTP_1080
    type: http
    server: 127.0.0.1
    port: 1080

proxy-groups:
  - name: 🚀Proxy
    type: select
    proxies:
      - ⚡Auto
      - 🚑Fallback
      - Local_HTTP_1080
      - DIRECT
  - name: ⚡Auto
    type: url-test
    proxies:
      - DIRECT
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true
    max-failed-times: 3
  - name: 🚑Fallback
    type: fallback
    proxies:
      - DIRECT
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 3000
    lazy: true
    max-failed-times: 3
  - name: 🤖AI
    type: select
    include-all: true
    exclude-filter: "HK|MO|CN"

rule-providers:
  private:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs
    path: ./rules/private.mrs
    interval: 86400
  category-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads.mrs
    path: ./rules/category-ads.mrs
    interval: 86400
  cn:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: ./rules/cn.mrs
    interval: 86400
  ai:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs
    path: ./rules/category-ai-!cn.mrs
    interval: 86400

rules:
  - RULE-SET,private,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - RULE-SET,category-ads,REJECT
  - RULE-SET,cn,DIRECT
  - RULE-SET,ai,🤖AI
  - GEOIP,CN,DIRECT
  - MATCH,🚀Proxy
