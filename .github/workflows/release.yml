name: Release

on:
  push:
    tags:
      - 'v*' # 推送以 v 开头的 tag 时触发，例如 v0.2.0

permissions:
  contents: write # 创建 Release 与上传产物需要写权限

jobs:
  release:
    name: Build & Publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package portable bundle & prepare release notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ "User-Agent" = "mihomo-tray-release" }
          if ($env:GITHUB_TOKEN) {
            $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN"
          }

          New-Item -ItemType Directory -Force -Path dist, dist\core, dist\config, dist\ui | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\mihomo-tray.exe dist\mihomo-tray.exe
          Copy-Item assets\tray.sample.yml dist\tray.yml
          Copy-Item assets\config.sample.yaml dist\config\config.yaml
          Copy-Item README.md dist\README.md
          Copy-Item README_zh.md dist\README_zh.md
          Copy-Item LICENSE dist\LICENSE

          # 1. Download latest Zephyruso/zashboard dist-no-fonts.zip into dist\ui\
          $zash = Invoke-RestMethod -Uri "https://api.github.com/repos/Zephyruso/zashboard/releases/latest" -Headers $headers
          $zashAsset = $zash.assets | Where-Object { $_.name -eq "dist-no-fonts.zip" } | Select-Object -First 1
          if (-not $zashAsset) { throw "dist-no-fonts.zip not found in Zephyruso/zashboard latest release" }
          Invoke-WebRequest -Uri $zashAsset.browser_download_url -OutFile zashboard.zip
          New-Item -ItemType Directory -Force -Path tmp_ui | Out-Null
          Expand-Archive -Path zashboard.zip -DestinationPath tmp_ui -Force
          if (Test-Path tmp_ui\dist\index.html) {
            Copy-Item tmp_ui\dist\* dist\ui -Recurse -Force
          } elseif (Test-Path tmp_ui\index.html) {
            Copy-Item tmp_ui\* dist\ui -Recurse -Force
          } else {
            throw "index.html not found inside zashboard dist-no-fonts.zip"
          }

          # 2. Download latest MetaCubeX/mihomo mihomo-windows-amd64-v3-v*.zip into dist\core\
          $mihomo = Invoke-RestMethod -Uri "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" -Headers $headers
          $mihomoAsset = $mihomo.assets | Where-Object { $_.name -match '^mihomo-windows-amd64-v3-v.*\.zip$' } | Select-Object -First 1
          if (-not $mihomoAsset) { throw "mihomo-windows-amd64-v3 asset not found in MetaCubeX/mihomo latest release" }
          Invoke-WebRequest -Uri $mihomoAsset.browser_download_url -OutFile mihomo.zip
          Expand-Archive -Path mihomo.zip -DestinationPath dist\core -Force
          $kernelExe = Get-ChildItem -Path dist\core -Filter "mihomo*.exe" | Select-Object -First 1
          if (-not $kernelExe) { throw "mihomo executable missing after extraction" }

          # 3. Download latest Loyalsoldier geoip.dat, geosite.dat, and Country.mmdb into dist\config\
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile dist\config\geoip.dat
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile dist\config\geosite.dat
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb" -OutFile dist\config\Country.mmdb

          # 4. Validate packaged config.yaml & geodata using the bundled mihomo kernel
          & $kernelExe.FullName -t -d dist\config -f dist\config\config.yaml
          if ($LASTEXITCODE -ne 0) { throw "mihomo config validation failed" }

          Compress-Archive -Path dist\* -DestinationPath mihomo-tray-windows-amd64.zip -Force

          $body = (Get-Content -Raw -Encoding utf8 .github/release-body.md) `
            .Replace('{{TAG}}', $env:GITHUB_REF_NAME) `
            .Replace('{{MIHOMO_TAG}}', $mihomo.tag_name) `
            .Replace('{{ZASHBOARD_TAG}}', $zash.tag_name)
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: mihomo-tray ${{ github.ref_name }}
          body_path: release-notes.md
          files: mihomo-tray-windows-amd64.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
